<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppBuilder Microwave 3000</title>
    <link rel="stylesheet" href="styles.css">
    <!-- JSZip Library for creating the downloadable app package -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

    <div class="microwave-container">
        <div class="brand">App-Matic 3000</div>
        
        <!-- Door / Window -->
        <div class="door-frame">
            <div class="window" id="mw-window">
                <div class="plate">
                    <div class="plate-content" id="plate-icon">📄</div>
                </div>

                <!-- CONFIGURATION OVERLAY -->
                <div class="input-overlay" id="config-overlay">
                    <h3>Configure App</h3>
                    
                    <div class="input-group">
                        <label>App Name</label>
                        <input type="text" id="cfg-name" value="MyCoolApp">
                    </div>

                    <div class="input-group">
                        <label>Recipe (Type)</label>
                        <select id="cfg-recipe">
                            <option value="todo">📝 To-Do List (Dynamic)</option>
                            <option value="feed">📰 News Feed (JSON)</option>
                            <option value="info">ℹ️ Info Card (Static)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Theme Color</label>
                        <input type="color" id="cfg-color" value="#6200ea" style="height:35px;">
                    </div>

                    <div class="input-group">
                        <label>Data (JSON - Optional)</label>
                        <textarea id="cfg-data" rows="3" placeholder='[{"title":"Item 1"}]'></textarea>
                        <small style="color:#aaa; font-size:0.7rem;">Used for Feed recipes</small>
                    </div>

                    <div class="features-group">
                        <label><input type="checkbox" id="feat-storage" checked> Save Data (Storage)</label>
                        <label><input type="checkbox" id="feat-pwa" checked> PWA Installer</label>
                    </div>
                </div>

                <!-- FINISHED OVERLAY -->
                <div class="input-overlay hidden" id="done-overlay">
                    <h1 style="color:#4CAF50; font-size:3rem; margin:0;">DONE!</h1>
                    <p>App compiled successfully.</p>
                    <div class="download-actions">
                        <button class="dl-btn" onclick="downloadZip()">📦 Install (.zip)</button>
                        <button class="dl-btn" onclick="resetMicrowave()">🔄 Reset</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="led-panel">
                <div class="display-text" id="display">00:00</div>
                <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                <div class="status-text" id="status-text">READY</div>
            </div>

            <div class="keypad">
                <button class="btn" onclick="addTime(10)">10s</button>
                <button class="btn" onclick="addTime(30)">30s</button>
                <button class="btn" onclick="addTime(60)">60s</button>
                <button class="btn btn-clear" onclick="resetMicrowave()">CANCEL</button>
                <button class="btn btn-action btn-start" onclick="startCooking()">START</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
